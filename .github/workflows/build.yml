name: macOS build and tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test battery parsing and device isolation
        run: ./Tests/run.sh
      - name: Build universal application
        run: ./build.sh
      - name: Verify updater bundle
        run: ./scripts/verify-bundle.sh
      - name: Package DMG
        run: ./scripts/package-dmg.sh
      - name: Package in-app update
        run: ./scripts/package-update.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Oraimo-Island-macOS-universal
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
